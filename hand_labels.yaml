# Hand shortlist for the Delta debt question. Lane B owns this file.
# Market ids were read from the public Kalshi API on 2026-10-10. They are live
# tickers, not placeholders. Lane A's kalshi adapter is still a stub, so the
# kind, threshold, group_key and outcome below are this file's reading of the
# public titles. They are not a check of A's parser.
# Polymarket search from this environment returned HTTP 403, so there is no
# second venue yet.
# The tail hike (H26) and tail cut (C26) keep outcome null. The engine's hike
# input is the 25bp contract only; a larger hike must not take that slot.
# KXWTIMAX is a touch market. It is a cross-check, not a close-above ladder input.

- venue: kalshi
  market_id: KXFEDDECISION-26OCT-H0
  relevant: true
  factor: rates
  yes_moves_factor: down
  mechanism: "YES means the Fed leaves the policy rate unchanged at the October 2026 meeting."
  citation: https://external-api.kalshi.com/trade-api/v2/markets/KXFEDDECISION-26OCT-H0
  kind: per_meeting
  outcome: hold
  group_key: KXFEDDECISION-26OCT

- venue: kalshi
  market_id: KXFEDDECISION-26OCT-H25
  relevant: true
  factor: rates
  yes_moves_factor: up
  mechanism: "YES means a 25bp hike, the rate shock the scenario engine applies."
  citation: https://external-api.kalshi.com/trade-api/v2/markets/KXFEDDECISION-26OCT-H25
  kind: per_meeting
  outcome: hike
  group_key: KXFEDDECISION-26OCT

- venue: kalshi
  market_id: KXFEDDECISION-26OCT-C25
  relevant: true
  factor: rates
  yes_moves_factor: down
  mechanism: "YES means a 25bp cut, which the engine folds into the hold probability."
  citation: https://external-api.kalshi.com/trade-api/v2/markets/KXFEDDECISION-26OCT-C25
  kind: per_meeting
  outcome: cut
  group_key: KXFEDDECISION-26OCT

- venue: kalshi
  market_id: KXFEDDECISION-26OCT-H26
  relevant: true
  factor: rates
  yes_moves_factor: up
  mechanism: "YES means a hike larger than 25bp. Not the engine's hike input."
  citation: https://external-api.kalshi.com/trade-api/v2/markets/KXFEDDECISION-26OCT-H26
  kind: per_meeting
  outcome: null
  group_key: KXFEDDECISION-26OCT

- venue: kalshi
