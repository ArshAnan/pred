# Hand labels observed 2026-10-10 from the Kalshi public API (no key).
# Fed: https://external-api.kalshi.com/trade-api/v2/markets?event_ticker=KXFEDDECISION-26OCT
# WTI close-above (strike_type greater), not a touch series:
# https://external-api.kalshi.com/trade-api/v2/markets?event_ticker=KXWTI-26OCT1314
# CPI: https://external-api.kalshi.com/trade-api/v2/markets?series_ticker=KXCPI&status=open
# KXCLOSEHORMUZ, KXHORMUZTRAFFIC, and KXHORMUZRETURN had no open markets.
# H26 and C26 are kind "other" so they do not replace the 25bp hike or cut.
# Hold uses yes_moves_factor "down" because the schema has no "unchanged";
# rate_states reads outcome, not direction.

- venue: kalshi
  market_id: KXFEDDECISION-26OCT-H0
  relevant: true
  factor: rates
  yes_moves_factor: down
  mechanism: "Yes means the Fed holds the funds rate at the October 2026 meeting."
  citation: "https://external-api.kalshi.com/trade-api/v2/markets?event_ticker=KXFEDDECISION-26OCT"
  kind: per_meeting
  outcome: hold
  group_key: KXFEDDECISION-26OCT

